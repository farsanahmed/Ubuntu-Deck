name: Build DroidLab Debug APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Command Line Tools
        run: |
          mkdir -p $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          # Move the tools to the latest directory as expected by sdkmanager
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv $HOME/android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          # Update PATH
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          # Install required packages: platform-tools, platforms;android-35, build-tools;35.0.0
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-35" "build-tools:35.0.0"
          # Accept all licenses
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

      - name: Verify SDK installation
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/platform-tools/adb
          ls $ANDROID_SDK_ROOT/build-tools/35.0.0/dx
          ls $ANDROID_SDK_ROOT/platforms/android-35/android.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrapper: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Java and Gradle version
        run: |
          java -version
          ./gradlew -v

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify libproot.so packaged in APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/app-debug.apk)
          echo "Checking $APK for lib/arm64-v8a/libproot.so"
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot\.so"; then
            echo "✓ libproot.so found in APK"
          else
            echo "✗ libproot.so NOT found in APK!"
            unzip -l "$APK" | grep lib/arm64-v8a || echo "No arm64-v8a libs found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Command Line Tools
        run: |
          mkdir -p $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv $HOME/android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-35" "build-tools:35.0.0"
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

      - name: Verify SDK installation
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/platform-tools/adb
          ls $ANDROID_SDK_ROOT/build-tools/35.0.0/dx
          ls $ANDROID_SDK_ROOT/platforms/android-35/android.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrapper: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify libproot.so packaged in release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk)
          echo "Checking $APK for lib/arm64-v8a/libproot.so"
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot\.so"; then
            echo "✓ libproot.so found in APK"
          else
            echo "✗ libproot.so NOT found in APK!"
            unzip -l "$APK" | grep lib/arm64-v8a || echo "No arm64-v8a libs found"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-release-apk
          path: app/build/outputs/apk/release/app-release*.apk

  release_debug:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: droidlab-debug-apk
          path: ./apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug build on ${{ github.sha }}
          files: ./apk/app-debug.apk
