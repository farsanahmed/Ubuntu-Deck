name: Build DroidLab Debug APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk-version: 25.2.9519653
          accept-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrapper: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Java and Gradle version
        run: |
          java -version
          ./gradlew -v

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify libproot.so packaged in APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/app-debug.apk)
          echo "Checking $APK for lib/arm64-v8a/libproot.so"
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot\.so"; then
            echo "✓ libproot.so found in APK"
          else
            echo "✗ libproot.so NOT found in APK!"
            unzip -l "$APK" | grep lib/arm64-v8a || echo "No arm64-v8a libs found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk-version: 25.2.9519653
          accept-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrapper: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify libproot.so packaged in release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk)
          echo "Checking $APK for lib/arm64-v8a/libproot.so"
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot\.so"; then
            echo "✓ libproot.so found in APK"
          else
            echo "✗ libproot.so NOT found in APK!"
            unzip -l "$APK" | grep lib/arm64-v8a || echo "No arm64-v8a libs found"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-release-apk
          path: app/build/outputs/apk/release/app-release*.apk

  release_debug:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: droidlab-debug-apk
          path: ./apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug build on ${{ github.sha }}
          files: ./apk/app-debug.apk
